version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1
  go: circleci/go@1.9.0

executors:
  linux:
    machine:
      image: default
  golang:
    docker:
      - image: cimg/go:1.25

# Define the jobs we want to run for this project
jobs:
  unit_test:
    executor: linux
    steps:
      - checkout
      - go/install:
          version: "1.25.12"
          cache: true
      - run:
          name: Run unit tests
          command: make test
  build:
    executor: golang
    steps:
      - checkout
      - run:
          name: Build
          command: make build
      - run:
          name: Run Examples 1
          command: ./example1

  security-scans:
    resource_class: small
    docker:
      - image: cimg/go:1.25
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto

  
# Orchestrate our job run sequence
workflows:
  test_and_release:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: cli-alerts
      - security-scans:
          context:
            - devex_cli
            - prodsec-orb-runtime
      - unit_test:
          name: Unit tests
      - build:
          name: Build
          requires:
            - Unit tests
